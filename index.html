      '<td class="num up">' + m0(j.pay * (c.tech.fleet_scale ? 1.15 : 1)) + "</td>" +
      '<td><button data-act="job" data-id="' + j.id + '" ' + (capFree < j.load ? "disabled" : "") + ">Take</button></td></tr>";
  }).join("") || '<tr><td colspan="6" class="faint">No loads on offer today.</td></tr>';

  return '<div class="grid g21">' +
    '<div class="grid">' +
      cardRaw("The map", '<div class="body"><canvas id="cv-map" height="330"></canvas>' +
        '<div class="tick">Road distances in kilometres. Your sites are marked in amber.</div></div>') +
      cardRaw("On the road", '<div class="scroll"><table><thead><tr><th>Cargo</th><th class="num">Qty</th>' +
        '<th>Route</th><th class="num">Arrives</th><th class="num">Cost</th></tr></thead><tbody>' + transit +
        "</tbody></table></div>") +
    "</div>" +
    '<div class="grid">' +
      card("Dispatch a load", '<div class="form">' +
        '<div class="row"><div><label>From</label><select data-f="sFrom" data-live="1">' + opts(0, "sFrom") + "</select></div>" +
        '<div><label>To</label><select data-f="sTo" data-live="1">' + opts(0, "sTo") + "</select></div></div>" +
        '<div><label>Cargo</label><select data-f="sCid" data-live="1">' + comms + "</select></div>" +
        '<div><label>Quantity</label><input data-f="sQty" data-live="1" value="' + esc(UI.f.sQty) + '" placeholder="0"></div>' +
        '<button class="primary" data-act="ship">Dispatch</button></div>' +
        '<div class="tick">You hold ' + qty(have) + " there. " +
        (q > 0 ? "Freight " + m0(cost) + " (" + px(cost / q) + " a unit), " + days + " day" + (days > 1 ? "s" : "") + " on the road. " +
          (self ? "Your own fleet carries it at 45% off." : "A carrier takes the job.") : "Enter a quantity for a quote.") +
        "</div>") +
      card("Fleet", '<div class="kv"><span>Haulage capacity</span><b>' + qty(E.haulCap(G, c)) + "</b></div>" +
        '<div class="kv"><span>In use</span><b>' + qty(E.haulUsed(G, c)) + "</b></div>" +
        '<div class="bar"><i style="width:' + Math.min(100, E.haulUsed(G, c) / Math.max(1, E.haulCap(G, c)) * 100) + '%"></i></div>' +
        '<div class="bar"><i style="width:' + Math.min(100, E.haulUsed(G, c) / Math.max(1, E.haulCap(G, c)) * 100) + '%"></i></div>'.slice(0,0) +
        '<div class="kv"><span>Traffic office</span><span class="chip ' + (c.autoHaul === false ? "" : "on") +
        '" data-act="autohaul">' + (c.autoHaul === false ? "off" : "takes spare loads") + '</span></div>' +
        '<div class="tick">Each truck depot carries 600 load units. Heavy ores take more room than machines. ' +

      cardRaw("Freight board", '<div class="scroll"><table><thead><tr><th>Cargo</th><th class="num">Qty</th><th>Route</th>' +
        '<th class="num">Load</th><th class="num">Pays</th><th></th></tr></thead><tbody>' + jobs + "</tbody></table></div>") +
    "</div></div>";
}

/* ---------- contracts ---------- */
function tabContracts() {
  var c = co();
  var mine = G.contracts.filter(function (k) { return k.seller === c.id || k.buyer === c.id; }).map(function (k) {
    var selling = k.seller === c.id;
    var other = G.co[selling ? k.buyer : k.seller];
    var short = selling && E.avail(c, k.rid, k.cid) < k.qtyPer;
    return "<tr><td>" + (selling ? '<span class="down">Supply</span>' : '<span class="up">Take</span>') + "</td>" +
      "<td>" + E.CMAP[k.cid].name + '</td><td class="num">' + qty(k.qtyPer) + "</td>" +
      '<td class="num">' + px(k.price) + '</td><td class="dim">' + E.RMAP[k.rid].name + "</td>" +
      "<td>" + esc(other ? other.name : "-") + '</td><td class="num">' + k.left + "</td>" +
      '<td class="num">' + Math.max(0, k.next - G.day) + "d" + (short ? ' <span class="down">short</span>' : "") + "</td></tr>";
  }).join("") || '<tr><td colspan="8" class="faint">No contracts running.</td></tr>';

  var open = G.offers.filter(function (o) { return o.from !== c.id; }).map(function (o) {
    var from = G.co[o.from];
    var fair = E.price(G, o.rid, o.cid);
    var edge = o.side === "sell" ? (fair - o.price) / fair : (o.price - fair) / fair;
    return "<tr><td>" + esc(from ? from.name : "-") + "</td>" +
      "<td>" + (o.side === "sell" ? "offers" : "wants") + " " + E.CMAP[o.cid].name + "</td>" +
      '<td class="num">' + qty(o.qtyPer) + " x" + o.deliveries + "</td>" +
      '<td class="num">' + px(o.price) + '</td><td class="num ' + cls(edge) + '">' + pc(edge) + "</td>" +
      '<td class="dim">' + E.RMAP[o.rid].name + " &middot; every " + o.interval + "d</td>" +
      '<td><button data-act="accept" data-id="' + o.id + '">Sign</button></td></tr>';
  }).join("") || '<tr><td colspan="7" class="faint">Nobody is offering terms today.</td></tr>';

  var mineOffers = G.offers.filter(function (o) { return o.from === c.id; }).map(function (o) {
    return "<tr><td>" + (o.side === "sell" ? "Supplying" : "Buying") + " " + E.CMAP[o.cid].name + "</td>" +
      '<td class="num">' + qty(o.qtyPer) + " x" + o.deliveries + '</td><td class="num">' + px(o.price) + "</td>" +
      '<td class="dim">' + E.RMAP[o.rid].name + '</td><td class="faint">expires in ' + o.ttl + "d</td></tr>";
  }).join("") || '<tr><td colspan="5" class="faint">You have nothing on the board.</td></tr>';

  var comms = E.COMM.map(function (cm) {
    return '<option value="' + cm.id + '" ' + (UI.f.kCid === cm.id ? "selected" : "") + ">" + cm.name + "</option>"; }).join("");
  var regs = E.REGIONS.map(function (r) {
    return '<option value="' + r.id + '" ' + (UI.f.kRegion === r.id ? "selected" : "") + ">" + r.name + "</option>"; }).join("");
  var total = (parseInt(UI.f.kQty, 10) || 0) * (parseInt(UI.f.kCount, 10) || 0) * (parseFloat(UI.f.kPrice) || 0);
  var span = (parseInt(UI.f.kCount, 10) || 0) * (parseInt(UI.f.kEvery, 10) || 0);

  return '<div class="grid g21">' +
    '<div class="grid">' +
      cardRaw("Your contracts", '<div class="scroll"><table><thead><tr><th>Side</th><th>Commodity</th>' +
        '<th class="num">Per run</th><th class="num">Price</th><th>Where</th><th>Counterparty</th>' +
        '<th class="num">Left</th><th class="num">Next</th></tr></thead><tbody>' + mine + "</tbody></table></div>") +
      cardRaw("Open terms", '<div class="scroll"><table><thead><tr><th>Firm</th><th>Terms</th>' +
        '<th class="num">Volume</th><th class="num">Price</th><th class="num">vs market</th><th>Detail</th>' +
        "<th></th></tr></thead><tbody>" + open + "</tbody></table></div>") +
      cardRaw("Posted by you", '<div class="scroll"><table><tbody>' + mineOffers + "</tbody></table></div>") +
    "</div>" +
    '<div class="grid">' +
      card("Write a contract", '<div class="form">' +
        '<div><label>Direction</label><select data-f="kSide" data-live="1">' +
          '<option value="sell" ' + (UI.f.kSide === "sell" ? "selected" : "") + ">I supply</option>" +
          '<option value="buy" ' + (UI.f.kSide === "buy" ? "selected" : "") + ">I buy</option></select></div>" +
        '<div><label>Commodity</label><select data-f="kCid" data-live="1">' + comms + "</select></div>" +
        '<div><label>Delivered at</label><select data-f="kRegion" data-live="1">' + regs + "</select></div>" +
        '<div class="row"><div><label>Units per run</label><input data-f="kQty" data-live="1" value="' + esc(UI.f.kQty) + '"></div>' +
        '<div><label>Every (days)</label><input data-f="kEvery" data-live="1" value="' + esc(UI.f.kEvery) + '"></div></div>' +
        '<div class="row"><div><label>Runs</label><input data-f="kCount" data-live="1" value="' + esc(UI.f.kCount) + '"></div>' +
        '<div><label>Price per unit</label><input data-f="kPrice" data-live="1" value="' + esc(UI.f.kPrice) + '" placeholder="' +
          E.price(G, UI.f.kRegion, UI.f.kCid).toFixed(2) + '"></div></div>' +
        '<button class="primary" data-act="offer">Post to the board</button></div>' +
        '<div class="tick">Market price today ' + px(E.price(G, UI.f.kRegion, UI.f.kCid)) + ". " +
        "Total " + m0(total) + " over " + span + " days. Miss a delivery and you pay a quarter of its value " +
        "and lose standing." + (co().tech.futures_desk ? " Your futures desk allows terms up to 180 days." :
        " Without a futures desk you are limited to 60 days.") + "</div>") +
      card("Standing", '<div class="kv"><span>Reputation</span><b>' + (c.rep * 100).toFixed(0) + "/100</b></div>" +
        '<div class="bar"><i style="width:' + Math.min(100, c.rep * 83) + '%"></i></div>' +
        '<div class="tick">Reliable delivery earns better terms and cheaper credit. Defaults cost both.</div>') +
    "</div></div>";
}

/* ---------- ledger ---------- */
function tabLedger() {
  var c = co();
  function sum(days) {
    var t = {}, h = c.hist.slice(-days);
    h.forEach(function (row) { for (var k in row.l) t[k] = (t[k] || 0) + row.l[k]; });
    t.profit = h.reduce(function (a, r) { return a + r.p; }, 0);
    return t;
  }
  var a = sum(1), b = sum(30);
  function line(label, key, neg) {
    var va = (a[key] || 0) * (neg ? -1 : 1), vb = (b[key] || 0) * (neg ? -1 : 1);
    return "<tr><td>" + label + '</td><td class="num ' + (neg ? "down" : "") + '">' + m0(va) +
      '</td><td class="num ' + (neg ? "down" : "") + '">' + m0(vb) + "</td></tr>";
  }
  var inv = 0;
  E.REGIONS.forEach(function (r) {
    var iv = c.inv[r.id] || {};
    for (var k in iv) inv += iv[k] * E.price(G, r.id, k);
  });
  var plant = E.assetValue(G, c) - inv * 0.9;
  var limit = E.creditLimit(G, c);

  return '<div class="grid g21">' +
    '<div class="grid">' +
      cardRaw("Trading account", "<table><thead><tr><th>Item</th><th class=\"num\">Yesterday</th>" +
        '<th class="num">Last 30 days</th></tr></thead><tbody>' +
        line("Sales", "rev") + line("Materials bought", "cogs", 1) + line("Wages", "wages", 1) +
        line("Power", "energy", 1) + line("Maintenance", "maint", 1) + line("Freight", "freight", 1) +
        line("Storage", "storage", 1) + line("Exchange fees", "fees", 1) + line("Research", "research", 1) +
        line("Interest", "interest", 1) + line("Penalties", "penalty", 1) + line("Tax", "tax", 1) +
        '<tr><td><b>Profit</b></td><td class="num ' + cls(a.profit) + '"><b>' + m0(a.profit || 0) + "</b></td>" +
        '<td class="num ' + cls(b.profit) + '"><b>' + m0(b.profit || 0) + "</b></td></tr>" +
        '<tr><td class="faint">Capital spending</td><td class="num faint">' + m0(-(a.capex || 0)) + "</td>" +
        '<td class="num faint">' + m0(-(b.capex || 0)) + "</td></tr>" +
        "</tbody></table>") +
      cardRaw("Cash", '<div class="body"><canvas id="cv-cash" height="130"></canvas>' +
        '<div class="tick">Cash balance, last 90 days. A company can be profitable and still run out.</div></div>') +
    "</div>" +
    '<div class="grid">' +
      card("Balance sheet",
        '<div class="kv"><span>Cash</span><b>' + m0(c.cash) + "</b></div>" +
        '<div class="kv"><span>Committed to open bids</span><b>' + m0(-c.escrow) + "</b></div>" +
        '<div class="kv"><span>Stock at market</span><b>' + m0(inv) + "</b></div>" +
        '<div class="kv"><span>Plant and equipment</span><b>' + m0(plant) + "</b></div>" +
        '<div class="kv"><span>Debt</span><b class="rust">' + m0(-c.debt) + "</b></div>" +
        '<div class="kv"><span>Company valuation</span><b class="amber">' + m0(c.valuation) + "</b></div>" +
        '<div class="kv"><span>Cumulative profit</span><b class="' + cls(c.cum.profit) + '">' + m0(c.cum.profit) + "</b></div>") +
      card("Credit",
        '<div class="kv"><span>Outstanding</span><b>' + m0(c.debt) + "</b></div>" +
        '<div class="kv"><span>Still available</span><b>' + m0(limit) + "</b></div>" +
        '<div class="kv"><span>Rate</span><b>' + ((E.BASE_INTEREST + (1.1 - c.rep) * 0.05) * 100).toFixed(1) + "% a year</b></div>" +
        '<div class="form" style="margin-top:8px"><input data-f="loan" value="' + esc(UI.f.loan) + '" placeholder="Amount">' +
        '<div class="row"><button data-act="borrow">Draw</button><button data-act="repay">Repay</button></div></div>') +
    "</div></div>";
}

/* ---------- intel ---------- */
function tabIntel() {
  var c = co();
  var full = !!c.tech.market_terminal;
  var head = "<tr><th>Commodity</th>" + E.REGIONS.map(function (r) {
    return '<th class="num">' + r.id + "</th>"; }).join("") +
    '<th class="num">Made</th><th class="num">Used</th><th class="num">Yours</th></tr>';
  var rows = E.COMM.map(function (cm) {
    var bal = G.balance[cm.id] || { made: 0, used: 0 };
    var mine = 0; E.REGIONS.forEach(function (r) { mine += E.invGet(c, r.id, cm.id); });
    return "<tr><td>" + cm.name + "</td>" + E.REGIONS.map(function (r) {
      var p = E.price(G, r.id, cm.id);
      var rel = p / cm.p0 - 1;
      return '<td class="num ' + (rel > 0.12 ? "up" : rel < -0.12 ? "down" : "") + '">' + px(p) + "</td>";
    }).join("") +
      '<td class="num faint">' + (full ? qty(bal.made) : "~" + qty(Math.round(bal.made / 5) * 5)) + "</td>" +
      '<td class="num faint">' + (full ? qty(bal.used) : "~" + qty(Math.round(bal.used / 5) * 5)) + "</td>" +
      '<td class="num">' + (mine > 0.5 ? qty(mine) : "-") + "</td></tr>";
  }).join("");

  var share = E.marketShare(G, c);
  var rivals = G.companies.filter(function (x) { return !x.isPlayer && !x.bankrupt; })
    .sort(function (x, y) { return y.valuation - x.valuation; }).map(function (x) {
      var v = full ? m0(x.valuation) : "~" + money(Math.round(x.valuation / 100000) * 100000);
      var sectors = {};
      x.buildings.forEach(function (b) { if (E.BUILD[b.type].cls !== "support") sectors[E.BUILD[b.type].name] = 1; });
      return "<tr><td>" + esc(x.name) + '</td><td class="dim">' + E.ARCH[x.arch].name + "</td>" +
        '<td class="num">' + x.buildings.length + '</td><td class="num">' + v + "</td>" +
        '<td class="dim">' + Object.keys(sectors).slice(0, 3).join(", ") + "</td></tr>";
    }).join("");

  var shares = Object.keys(share).sort(function (a, b) { return share[b] - share[a]; }).slice(0, 6).map(function (k) {
    return '<div class="kv"><span>' + E.CMAP[k].name + "</span><b>" + (share[k] * 100).toFixed(1) + "%</b></div>" +
      '<div class="bar"><i style="width:' + Math.min(100, share[k] * 100) + '%"></i></div>';
  }).join("") || '<div class="faint">You have sold nothing yet.</div>';

  var evs = G.events.map(function (ev) {
    return '<div class="kv"><span>' + evName(ev.kind) + "</span><b>" + ev.left + " days</b></div>";
  }).join("") || '<div class="faint">Quiet conditions.</div>';

  return '<div class="grid g21">' +
    '<div class="grid">' +
      cardRaw("Prices by region", "<table><thead>" + head + "</thead><tbody>" + rows + "</tbody></table>",
        full ? "verified figures" : "trade gossip") +
      cardRaw("Rivals", '<table><thead><tr><th>Firm</th><th>Type</th><th class="num">Sites</th>' +
        '<th class="num">Valuation</th><th>Interests</th></tr></thead><tbody>' + rivals + "</tbody></table>") +
    "</div>" +
    '<div class="grid">' +
      card("Your share of sales", shares) +
      card("Conditions", evs +
        '<div class="kv" style="margin-top:6px"><span>Wider economy</span><b>' +
        Math.round(G.econ * (G.growth || 1) * 100) + "</b></div>") +
      card("Reading the board", '<div class="dim" style="font-size:11px;line-height:1.6">' +
        "Prices above the reference mean the world wants more than it makes. Prices below mean a glut, " +
        "and the marginal producer is about to stop. Watch what falls out of production: that is where " +
        "the next shortage comes from." + (full ? "" : " A market terminal replaces these estimates with real figures.") +
        "</div>") +
    "</div></div>";
}
function evName(k) {
  return ({ mine_collapse: "Shaft collapse", discovery: "New reserves", energy_shortage: "Power rationing",
    plant_fire: "Plant fire", route_closed: "Road closed", demand_surge: "Demand surge",
    breakthrough: "New process", public_works: "State building programme", conflict: "Frontier conflict",
    recession: "Recession", strike: "Labour dispute", glut: "Import glut" })[k] || k;
}

/* ---------- charts ---------- */
function ctxFor(id) {
  var cv = document.getElementById(id);
  if (!cv) return null;
  var w = cv.clientWidth || 300, h = cv.height;
  var dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.style.height = h + "px";
  cv.height = h * dpr;
  var g = cv.getContext("2d");
  g.scale(dpr, dpr);
  return { g: g, w: w, h: h };
}
function lineChart(id, pts, color, fmt) {
  var c = ctxFor(id);
  if (!c || pts.length < 2) return;
  var g = c.g, w = c.w, h = c.h, pad = 26;
  var lo = Infinity, hi = -Infinity;
  pts.forEach(function (p) { if (p < lo) lo = p; if (p > hi) hi = p; });
  if (hi - lo < 1e-6) { hi = lo + 1; lo -= 1; }
  var span = hi - lo;
  lo -= span * 0.12; hi += span * 0.12;
  g.clearRect(0, 0, w, h);
  g.strokeStyle = "#221D18"; g.lineWidth = 1;
  for (var i = 0; i <= 3; i++) {
    var y = 6 + (h - 18) * i / 3;
    g.beginPath(); g.moveTo(pad, y); g.lineTo(w - 4, y); g.stroke();
    g.fillStyle = "#6A6055"; g.font = "9px ui-monospace, monospace";
    g.fillText(fmt(hi - (hi - lo) * i / 3), 2, y + 3);
  }
  g.beginPath();
  pts.forEach(function (p, i) {
    var x = pad + (w - pad - 4) * i / (pts.length - 1);
    var y = 6 + (h - 18) * (1 - (p - lo) / (hi - lo));
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  });
  g.strokeStyle = color; g.lineWidth = 1.4; g.stroke();
  g.lineTo(w - 4, h - 12); g.lineTo(pad, h - 12); g.closePath();
  var grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color.replace(")", ",.18)").replace("rgb", "rgba"));
  grad.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grad; g.fill();
}
function drawCharts() {
  if (UI.screen !== "game" || !G) return;
  var c = co();
  if (UI.tab === "dash") {
    lineChart("cv-net", c.netHist.slice(-90).map(function (x) { return x.v; }), "rgb(224,163,46)", function (v) { return money(v); });
  } else if (UI.tab === "market") {
    var h = E.book(G, UI.region, UI.cid).hist.slice(-120).map(function (x) { return x.p; });
    lineChart("cv-price", h, "rgb(180,83,42)", function (v) { return px(v); });
  } else if (UI.tab === "ledger") {
    lineChart("cv-cash", c.hist.slice(-90).map(function (x) { return x.cash; }), "rgb(143,168,95)", function (v) { return money(v); });
  } else if (UI.tab === "log") {
    drawMap();
  }
}
function drawMap() {
  var c = ctxFor("cv-map");
  if (!c) return;
  var g = c.g, w = c.w, h = c.h;
  g.clearRect(0, 0, w, h);
  var sx = w / 700, sy = h / 470;
  function P(r) { return { x: 30 + r.x * sx * 0.9, y: 20 + r.y * sy * 0.9 }; }
  g.font = "10px ui-monospace, monospace";
  E.REGIONS.forEach(function (a, i) {
    E.REGIONS.forEach(function (b, j) {
      if (j <= i) return;
      var pa = P(a), pb = P(b);
      var key = a.id < b.id ? a.id + "|" + b.id : b.id + "|" + a.id;
      var blocked = (G.freightMod[key] || 1) > 1.5;
      g.strokeStyle = blocked ? "#C7573A" : "#2E2823";
      g.lineWidth = blocked ? 1.6 : 1;
      g.beginPath(); g.moveTo(pa.x, pa.y); g.lineTo(pb.x, pb.y); g.stroke();
      g.fillStyle = "#4A4038";
      g.fillText(E.dist(a.id, b.id) + "km", (pa.x + pb.x) / 2 - 12, (pa.y + pb.y) / 2 - 3);
    });
  });
  G.shipments.forEach(function (s) {
    var a = P(E.RMAP[s.from]), b = P(E.RMAP[s.to]);
    var total = Math.max(1, E.transitDays(s.from, s.to));
    var t = 1 - Math.max(0, s.arrive - G.day) / total;
    var x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
    g.fillStyle = s.co === co().id ? "#E0A32E" : "#4A4038";
    g.fillRect(x - 2, y - 2, 4, 4);
  });
  E.REGIONS.forEach(function (r) {
    var p = P(r);
    var mine = co().buildings.filter(function (b) { return b.rid === r.id; }).length;
    g.beginPath(); g.arc(p.x, p.y, 7, 0, Math.PI * 2);
    g.fillStyle = mine ? "#B4532A" : "#221D18";
    g.strokeStyle = mine ? "#E0A32E" : "#4A4038";
    g.fill(); g.stroke();
    g.fillStyle = "#E8E1D4"; g.font = "11px ui-monospace, monospace";
    g.fillText(r.name, p.x + 12, p.y + 3);
    g.fillStyle = "#6A6055"; g.font = "9px ui-monospace, monospace";
    var dep = Object.keys(G.regionState[r.id].deposits).map(function (k) { return E.CMAP[k].name; }).join(", ");
    g.fillText(mine ? mine + " of your sites" : (dep || "industrial centre"), p.x + 12, p.y + 15);
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
else start();
